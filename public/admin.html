<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Admin</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #4f46e5;
      --border: rgba(148, 163, 184, 0.28);
      --success: #16a34a;
      --shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "Segoe UI", sans-serif; background: linear-gradient(135deg, rgba(79,70,229,0.08), rgba(16,185,129,0.08)), var(--bg); color: var(--text);
    }
    .shell { max-width: 1100px; margin: 40px auto; padding: 0 20px 40px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: clamp(2rem, 2vw + 1.1rem, 3rem); }
    .btn { border: none; border-radius: 12px; padding: 0.9rem 1.3rem; font-weight: 700; cursor: pointer; font: inherit; }
    .btn.primary { background: linear-gradient(135deg, var(--primary), #6366f1); color: white; }
    .btn.secondary { background: rgba(99, 102, 241, 0.08); border: 1px solid var(--border); color: var(--text); }
    .panel { background: rgba(255,255,255,0.82); border: 1px solid var(--border); border-radius: 24px; box-shadow: var(--shadow); padding: 24px; }
    form { display: grid; gap: 28px; }
    .section-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px; }
    .field { display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 0.8rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
    input, textarea { width: 100%; border: 1px solid rgba(148, 163, 184, 0.5); border-radius: 12px; padding: 0.9rem 1rem; font: inherit; color: var(--text); background: white; }
    textarea { min-height: 110px; resize: vertical; }
    .experience-block, .featured-work-block { border: 1px solid var(--border); background: rgba(238,242,255,0.7); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
    .remove-btn { justify-self: end; background: rgba(239,68,68,0.1); color: #b91c1c; border: 1px solid rgba(239,68,68,0.2); border-radius: 10px; padding: 0.5rem 0.75rem; font-weight: 700; cursor: pointer; }
    .actions { display: flex; justify-content: flex-end; gap: 12px; }
    .status { min-height: 24px; font-weight: 700; color: var(--success); }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <h1>Portfolio Admin</h1>
      <button type="button" class="btn secondary" id="logoutBtn">Logout</button>
    </header>

    <main class="panel">
      <form id="adminForm">
        <section>
          <h2>Site info</h2>
          <div class="section-grid">
            <div class="field"><label for="brand">Brand name</label><input id="brand" type="text" /></div>
            <div class="field"><label for="github">GitHub text</label><input id="github" type="text" /></div>
            <div class="field"><label for="githubUrl">GitHub URL</label><input id="githubUrl" type="url" /></div>
          </div>
        </section>

        <section>
          <h2>Hero section</h2>
          <div class="section-grid">
            <div class="field"><label for="heroEyebrow">Eyebrow</label><input id="heroEyebrow" type="text" /></div>
            <div class="field" style="grid-column: 1 / -1;"><label for="heroTitle">Title</label><input id="heroTitle" type="text" /></div>
            <div class="field" style="grid-column: 1 / -1;"><label for="heroDescription">Description</label><textarea id="heroDescription"></textarea></div>
          </div>
        </section>

        <section>
          <h2>Profile</h2>
          <div class="section-grid">
            <div class="field"><label for="profileName">Profile name</label><input id="profileName" type="text" /></div>
            <div class="field"><label for="profileImage">Profile image path</label><input id="profileImage" type="text" /></div>
            <div class="field"><label for="profileGithubText">Profile GitHub text</label><input id="profileGithubText" type="text" /></div>
            <div class="field"><label for="profileGithubUrl">Profile GitHub URL</label><input id="profileGithubUrl" type="url" /></div>
          </div>
        </section>

        <section>
          <h2>Summary & contact</h2>
          <div class="section-grid">
            <div class="field"><label for="summaryTitle">Summary title</label><input id="summaryTitle" type="text" /></div>
            <div class="field" style="grid-column: 1 / -1;"><label for="summaryText">Summary text</label><textarea id="summaryText"></textarea></div>
            <div class="field"><label for="contactEmail">Email</label><input id="contactEmail" type="email" /></div>
            <div class="field"><label for="contactLocation">Location</label><input id="contactLocation" type="text" /></div>
            <div class="field"><label for="contactLinkedin">LinkedIn</label><input id="contactLinkedin" type="text" /></div>
            <div class="field"><label for="contactPhone">Phone</label><input id="contactPhone" type="text" /></div>
          </div>
        </section>

        <section>
          <h2>Stats</h2>
          <div class="section-grid">
            <div class="field"><label for="stat1Value">Stat 1 value</label><input id="stat1Value" type="text" /></div>
            <div class="field"><label for="stat1Label">Stat 1 label</label><input id="stat1Label" type="text" /></div>
            <div class="field"><label for="stat2Value">Stat 2 value</label><input id="stat2Value" type="text" /></div>
            <div class="field"><label for="stat2Label">Stat 2 label</label><input id="stat2Label" type="text" /></div>
            <div class="field"><label for="stat3Value">Stat 3 value</label><input id="stat3Value" type="text" /></div>
            <div class="field"><label for="stat3Label">Stat 3 label</label><input id="stat3Label" type="text" /></div>
          </div>
        </section>

        <section>
          <h2>Key statistics cards</h2>
          <div class="section-grid">
            <div class="field"><label for="keyMetric1Label">Card 1 heading</label><input id="keyMetric1Label" type="text" /></div>
            <div class="field"><label for="keyMetric1Value">Card 1 value</label><input id="keyMetric1Value" type="text" /></div>
            <div class="field" style="grid-column: 1 / -1;"><label for="keyMetric1Detail">Card 1 description</label><input id="keyMetric1Detail" type="text" /></div>
            <div class="field"><label for="keyMetric2Label">Card 2 heading</label><input id="keyMetric2Label" type="text" /></div>
            <div class="field"><label for="keyMetric2Value">Card 2 value</label><input id="keyMetric2Value" type="text" /></div>
            <div class="field" style="grid-column: 1 / -1;"><label for="keyMetric2Detail">Card 2 description</label><input id="keyMetric2Detail" type="text" /></div>
            <div class="field"><label for="keyMetric3Label">Card 3 heading</label><input id="keyMetric3Label" type="text" /></div>
            <div class="field"><label for="keyMetric3Value">Card 3 value</label><input id="keyMetric3Value" type="text" /></div>
            <div class="field" style="grid-column: 1 / -1;"><label for="keyMetric3Detail">Card 3 description</label><input id="keyMetric3Detail" type="text" /></div>
            <div class="field"><label for="keyMetric4Label">Card 4 heading</label><input id="keyMetric4Label" type="text" /></div>
            <div class="field"><label for="keyMetric4Value">Card 4 value</label><input id="keyMetric4Value" type="text" /></div>
            <div class="field" style="grid-column: 1 / -1;"><label for="keyMetric4Detail">Card 4 description</label><input id="keyMetric4Detail" type="text" /></div>
          </div>
        </section>

        <section>
          <h2>Focus areas</h2>
          <div class="section-grid">
            <div class="field"><label for="focusArea1Label">Focus 1 label</label><input id="focusArea1Label" type="text" /></div>
            <div class="field"><label for="focusArea1Value">Focus 1 value</label><input id="focusArea1Value" type="number" min="0" max="100" /></div>
            <div class="field"><label for="focusArea2Label">Focus 2 label</label><input id="focusArea2Label" type="text" /></div>
            <div class="field"><label for="focusArea2Value">Focus 2 value</label><input id="focusArea2Value" type="number" min="0" max="100" /></div>
            <div class="field"><label for="focusArea3Label">Focus 3 label</label><input id="focusArea3Label" type="text" /></div>
            <div class="field"><label for="focusArea3Value">Focus 3 value</label><input id="focusArea3Value" type="number" min="0" max="100" /></div>
          </div>
        </section>

        <section>
          <h2>Skills</h2>
          <div class="field"><label for="skills">Skills (comma separated)</label><textarea id="skills"></textarea></div>
        </section>

        <section>
          <h2>Core skills proficiency</h2>
          <div class="section-grid">
            <div class="field"><label for="coreSkill1Label">Skill 1 name</label><input id="coreSkill1Label" type="text" /></div>
            <div class="field"><label for="coreSkill1Value">Skill 1 proficiency (0-100)</label><input id="coreSkill1Value" type="number" min="0" max="100" /></div>
            <div class="field"><label for="coreSkill2Label">Skill 2 name</label><input id="coreSkill2Label" type="text" /></div>
            <div class="field"><label for="coreSkill2Value">Skill 2 proficiency (0-100)</label><input id="coreSkill2Value" type="number" min="0" max="100" /></div>
            <div class="field"><label for="coreSkill3Label">Skill 3 name</label><input id="coreSkill3Label" type="text" /></div>
            <div class="field"><label for="coreSkill3Value">Skill 3 proficiency (0-100)</label><input id="coreSkill3Value" type="number" min="0" max="100" /></div>
            <div class="field"><label for="coreSkill4Label">Skill 4 name</label><input id="coreSkill4Label" type="text" /></div>
            <div class="field"><label for="coreSkill4Value">Skill 4 proficiency (0-100)</label><input id="coreSkill4Value" type="number" min="0" max="100" /></div>
            <div class="field"><label for="coreSkill5Label">Skill 5 name</label><input id="coreSkill5Label" type="text" /></div>
            <div class="field"><label for="coreSkill5Value">Skill 5 proficiency (0-100)</label><input id="coreSkill5Value" type="number" min="0" max="100" /></div>
            <div class="field"><label for="coreSkill6Label">Skill 6 name</label><input id="coreSkill6Label" type="text" /></div>
            <div class="field"><label for="coreSkill6Value">Skill 6 proficiency (0-100)</label><input id="coreSkill6Value" type="number" min="0" max="100" /></div>
          </div>
        </section>

        <section>
          <h2>Experience</h2>
          <div id="experienceList"></div>
          <div class="actions" style="justify-content: flex-start; margin-top: 12px;"><button type="button" class="btn secondary" id="addExperienceBtn">+ Add Experience</button></div>
        </section>

        <section>
          <h2>Featured work</h2>
          <div id="featuredWorkList"></div>
          <div class="actions" style="justify-content: flex-start; margin-top: 12px;"><button type="button" class="btn secondary" id="addFeaturedWorkBtn">+ Add project</button></div>
        </section>

        <div class="actions">
          <button type="button" class="btn secondary" onclick="window.location.href = getPublicPortfolioUrl()">Back to site</button>
          <button type="submit" class="btn primary">Save and update</button>
        </div>
        <div id="status" class="status" aria-live="polite"></div>
      </form>
    </main>
  </div>

  <script>
    const ADMIN_PASSWORD = window.ADMIN_PASSWORD || '';
    const apiUrl = '/api/portfolio';
    const authKey = 'portfolio-admin-authorized';
    const defaultKeyMetrics = [
      { label: 'Experience', value: '5+ yrs', detail: 'Across SaaS, fintech, and commerce' },
      { label: 'Automation', value: '85%', detail: 'Reporting workflows automated' },
      { label: 'Efficiency', value: '35%', detail: 'Faster decision cycles' },
      { label: 'Impact', value: '14%', detail: 'Conversion wins through insights' }
    ];
    const defaultCoreSkills = [
      { label: 'SQL', value: 92 },
      { label: 'Python', value: 88 },
      { label: 'Power BI', value: 90 },
      { label: 'Tableau', value: 84 },
      { label: 'Excel', value: 86 },
      { label: 'Forecasting', value: 80 }
    ];
    const defaultFeaturedWork = [
      { category: 'Growth', highlight: '+24%', title: 'Revenue Intelligence Dashboard', description: 'Designed a multi-channel performance model that unified product and marketing analytics for executive monitoring.', metricLabel: 'ROI uplift', metricValue: '24%' },
      { category: 'Automation', highlight: '6 hrs', title: 'Automated KPI Reporting', description: 'Built a unified weekly reporting pipeline reducing manual reporting time and improving business responsiveness.', metricLabel: 'Saved per week', metricValue: '6 hrs' }
    ];

    function getPublicPortfolioUrl() {
      const timestamp = Date.now();
      if (window.location.hostname === 'localhost' || window.location.protocol === 'file:') {
        return `../index.html?v=${timestamp}`;
      }
      return `https://amans-2201.github.io/Static-Portfolio/?v=${timestamp}`;
    }

    function getAuthOverlay() {
      const existing = document.getElementById('adminAuthOverlay');
      if (existing) return existing;

      const overlay = document.createElement('div');
      overlay.id = 'adminAuthOverlay';
      overlay.style.position = 'fixed';
      overlay.style.inset = '0';
      overlay.style.background = 'rgba(15, 23, 42, 0.72)';
      overlay.style.display = 'flex';
      overlay.style.alignItems = 'center';
      overlay.style.justifyContent = 'center';
      overlay.style.zIndex = '9999';

      const box = document.createElement('div');
      box.style.width = 'min(420px, calc(100% - 28px))';
      box.style.background = '#fff';
      box.style.borderRadius = '20px';
      box.style.padding = '24px';
      box.style.boxShadow = '0 20px 45px rgba(15, 23, 42, 0.22)';
      box.innerHTML = `
        <h2 style="margin:0 0 8px;font-size:1.7rem;">Admin access</h2>
        <p style="margin:0 0 18px;color:#475569;">Enter the password to continue.</p>
        <input id="adminAuthInput" type="password" placeholder="Password" style="width:100%;border:1px solid rgba(148,163,184,0.6);border-radius:12px;padding:0.9rem 1rem;font:inherit;margin-bottom:14px;" />
        <div style="display:flex;justify-content:flex-end;gap:10px;">
          <button type="button" id="adminAuthCancel" style="border:none;border-radius:12px;padding:0.75rem 1rem;background:#eef2ff;color:#1f2937;font-weight:700;cursor:pointer;">Cancel</button>
          <button type="button" id="adminAuthSubmit" style="border:none;border-radius:12px;padding:0.75rem 1rem;background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;font-weight:700;cursor:pointer;">Open</button>
        </div>
      `;

      overlay.appendChild(box);
      document.body.appendChild(overlay);
      return overlay;
    }

    function authorizeAdmin() {
      if (!ADMIN_PASSWORD) {
        alert('Admin password is not configured.');
        window.location.href = getPublicPortfolioUrl();
        return false;
      }

      const stored = sessionStorage.getItem(authKey) === 'true';
      if (stored) return true;

      const overlay = getAuthOverlay();
      const input = document.getElementById('adminAuthInput');
      const submit = document.getElementById('adminAuthSubmit');
      const cancel = document.getElementById('adminAuthCancel');

      const unlock = () => {
        const password = input.value.trim();
        if (password === ADMIN_PASSWORD) {
          sessionStorage.setItem(authKey, 'true');
          overlay.remove();
          loadData();
          return;
        }

        input.value = '';
        input.focus();
        alert('Incorrect password.');
      };

      submit.addEventListener('click', unlock);
      cancel.addEventListener('click', () => {
        sessionStorage.removeItem(authKey);
        window.location.href = getPublicPortfolioUrl();
      });
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') unlock();
      });

      input.focus();
      return false;
    }

    function createExperienceBlock(entry = {}) {
      const block = document.createElement('div');
      block.className = 'experience-block';
      block.innerHTML = `
        <button type="button" class="remove-btn">Remove</button>
        <div class="field"><label>Period</label><input type="text" data-field="period" value="${(entry.period || '').replace(/"/g, '&quot;')}" /></div>
        <div class="field"><label>Title</label><input type="text" data-field="title" value="${(entry.title || '').replace(/"/g, '&quot;')}" /></div>
        <div class="field"><label>Text</label><textarea data-field="text">${(entry.text || '').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</textarea></div>
      `;
      block.querySelector('.remove-btn').addEventListener('click', () => block.remove());
      return block;
    }

    function renderExperience(entries) {
      const list = document.getElementById('experienceList');
      list.innerHTML = '';
      const items = entries && entries.length ? entries : [{ period: '2024 — Present', title: 'Lead Analytics Architect — FinTech Corp', text: 'Leading the design of cloud-based forecasting, self-serve dashboards, and executive insight systems across the organization.' }];
      items.forEach(item => list.appendChild(createExperienceBlock(item)));
    }

    function escapeMarkup(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[character]);
    }

    function createFeaturedWorkBlock(item = {}) {
      const block = document.createElement('div');
      block.className = 'featured-work-block';
      block.innerHTML = `
        <button type="button" class="remove-btn">Remove</button>
        <div class="section-grid">
          <div class="field"><label>Category</label><input type="text" data-field="category" value="${escapeMarkup(item.category)}" /></div>
          <div class="field"><label>Top highlight</label><input type="text" data-field="highlight" value="${escapeMarkup(item.highlight)}" /></div>
          <div class="field"><label>Project title</label><input type="text" data-field="title" value="${escapeMarkup(item.title)}" /></div>
          <div class="field"><label>Metric label</label><input type="text" data-field="metricLabel" value="${escapeMarkup(item.metricLabel)}" /></div>
          <div class="field"><label>Metric value</label><input type="text" data-field="metricValue" value="${escapeMarkup(item.metricValue)}" /></div>
          <div class="field" style="grid-column: 1 / -1;"><label>Description</label><textarea data-field="description">${escapeMarkup(item.description)}</textarea></div>
        </div>
      `;
      block.querySelector('.remove-btn').addEventListener('click', () => block.remove());
      return block;
    }

    function renderFeaturedWork(entries) {
      const list = document.getElementById('featuredWorkList');
      list.replaceChildren();
      const items = Array.isArray(entries) ? entries : defaultFeaturedWork;
      items.forEach(item => list.appendChild(createFeaturedWorkBlock(item)));
    }

    function setValue(id, value) {
      const input = document.getElementById(id);
      if (input) input.value = value ?? '';
    }

    async function loadData() {
      try {
        const response = await fetch(apiUrl, { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`API request failed: ${response.status}`);
        }

        const data = await response.json();
        const keyMetrics = Array.isArray(data.keyMetrics) ? data.keyMetrics : defaultKeyMetrics;
        const coreSkills = Array.isArray(data.coreSkills) ? data.coreSkills : defaultCoreSkills;
        const featuredWork = Array.isArray(data.featuredWork) ? data.featuredWork : defaultFeaturedWork;

        setValue('brand', data.site?.brand || 'Alex Morgan');
        setValue('github', data.site?.github || 'github.com/alexmorgan');
        setValue('githubUrl', data.site?.githubUrl || 'https://github.com/alexmorgan');
        setValue('heroEyebrow', data.hero?.eyebrow || 'Data Analyst • Storyteller');
        setValue('heroTitle', data.hero?.title || 'I turn raw data into business momentum.');
        setValue('heroDescription', data.hero?.description || '');
        setValue('profileName', data.profile?.name || 'Alex Morgan');
        setValue('profileImage', data.profile?.image || './dummy-profile.jpg');
        setValue('profileGithubText', data.profile?.githubText || 'github.com/alexmorgan');
        setValue('profileGithubUrl', data.profile?.githubUrl || 'https://github.com/alexmorgan');
        setValue('summaryTitle', data.summary?.title || 'Professional Summary');
        setValue('summaryText', data.summary?.text || '');
        setValue('contactEmail', data.contact?.email || 'alex.morgan@email.com');
        setValue('contactLocation', data.contact?.location || 'New York, NY');
        setValue('contactLinkedin', data.contact?.linkedin || 'linkedin.com/in/alexmorgan');
        setValue('contactPhone', data.contact?.phone || '+1 (415) 224-9901');
        setValue('stat1Value', data.stats?.[0]?.value || '5+');
        setValue('stat1Label', data.stats?.[0]?.label || 'Years experience');
        setValue('stat2Value', data.stats?.[1]?.value || '40+');
        setValue('stat2Label', data.stats?.[1]?.label || 'Dashboards shipped');
        setValue('stat3Value', data.stats?.[2]?.value || '$2.4M');
        setValue('stat3Label', data.stats?.[2]?.label || 'Revenue impact');
        defaultKeyMetrics.forEach((_, index) => {
          const metric = keyMetrics[index] || {};
          const itemNumber = index + 1;
          setValue(`keyMetric${itemNumber}Label`, metric.label);
          setValue(`keyMetric${itemNumber}Value`, metric.value);
          setValue(`keyMetric${itemNumber}Detail`, metric.detail);
        });
        setValue('focusArea1Label', data.focusAreas?.[0]?.label || 'Analytics');
        setValue('focusArea1Value', data.focusAreas?.[0]?.value ?? 45);
        setValue('focusArea2Label', data.focusAreas?.[1]?.label || 'Product');
        setValue('focusArea2Value', data.focusAreas?.[1]?.value ?? 35);
        setValue('focusArea3Label', data.focusAreas?.[2]?.label || 'Insights');
        setValue('focusArea3Value', data.focusAreas?.[2]?.value ?? 20);
        setValue('skills', (data.skills || []).join(', '));
        defaultCoreSkills.forEach((_, index) => {
          const skill = coreSkills[index] || {};
          const itemNumber = index + 1;
          setValue(`coreSkill${itemNumber}Label`, skill.label);
          setValue(`coreSkill${itemNumber}Value`, skill.value);
        });
        renderFeaturedWork(featuredWork);
        renderExperience(Array.isArray(data.experience) ? data.experience : []);
      } catch (error) {
        console.error('Failed to load portfolio data:', error);
        const fallback = {
          site: { brand: 'Alex Morgan', github: 'github.com/alexmorgan', githubUrl: 'https://github.com/alexmorgan' },
          hero: { eyebrow: 'Data Analyst • Storyteller', title: 'I turn raw data into business momentum.', description: '' },
          profile: { name: 'Alex Morgan', image: './dummy-profile.jpg', githubText: 'github.com/alexmorgan', githubUrl: 'https://github.com/alexmorgan' },
          stats: [
            { value: '5+', label: 'Years experience' },
            { value: '40+', label: 'Dashboards shipped' },
            { value: '$2.4M', label: 'Revenue impact' }
          ],
          summary: { title: 'Professional Summary', text: '' },
          skills: ['Python', 'SQL', 'Power BI', 'Tableau', 'A/B Testing', 'Forecasting'],
          contact: { email: 'alex.morgan@email.com', location: 'New York, NY', linkedin: 'linkedin.com/in/alexmorgan', phone: '+1 (415) 224-9901' },
          focusAreas: [
            { label: 'Analytics', value: 45 },
            { label: 'Product', value: 35 },
            { label: 'Insights', value: 20 }
          ],
          experience: [
            { period: '2024 — Present', title: 'Lead Analytics Architect — FinTech Corp', text: 'Leading the design of cloud-based forecasting, self-serve dashboards, and executive insight systems across the organization.' }
          ]
        };

        setValue('brand', fallback.site.brand);
        setValue('github', fallback.site.github);
        setValue('githubUrl', fallback.site.githubUrl);
        setValue('heroEyebrow', fallback.hero.eyebrow);
        setValue('heroTitle', fallback.hero.title);
        setValue('heroDescription', fallback.hero.description);
        setValue('profileName', fallback.profile.name);
        setValue('profileImage', fallback.profile.image);
        setValue('profileGithubText', fallback.profile.githubText);
        setValue('profileGithubUrl', fallback.profile.githubUrl);
        setValue('summaryTitle', fallback.summary.title);
        setValue('summaryText', fallback.summary.text);
        setValue('contactEmail', fallback.contact.email);
        setValue('contactLocation', fallback.contact.location);
        setValue('contactLinkedin', fallback.contact.linkedin);
        setValue('contactPhone', fallback.contact.phone);
        setValue('stat1Value', fallback.stats[0].value);
        setValue('stat1Label', fallback.stats[0].label);
        setValue('stat2Value', fallback.stats[1].value);
        setValue('stat2Label', fallback.stats[1].label);
        setValue('stat3Value', fallback.stats[2].value);
        setValue('stat3Label', fallback.stats[2].label);
        defaultKeyMetrics.forEach((metric, index) => {
          const itemNumber = index + 1;
          setValue(`keyMetric${itemNumber}Label`, metric.label);
          setValue(`keyMetric${itemNumber}Value`, metric.value);
          setValue(`keyMetric${itemNumber}Detail`, metric.detail);
        });
        setValue('focusArea1Label', fallback.focusAreas[0].label);
        setValue('focusArea1Value', fallback.focusAreas[0].value);
        setValue('focusArea2Label', fallback.focusAreas[1].label);
        setValue('focusArea2Value', fallback.focusAreas[1].value);
        setValue('focusArea3Label', fallback.focusAreas[2].label);
        setValue('focusArea3Value', fallback.focusAreas[2].value);
        setValue('skills', fallback.skills.join(', '));
        defaultCoreSkills.forEach((skill, index) => {
          const itemNumber = index + 1;
          setValue(`coreSkill${itemNumber}Label`, skill.label);
          setValue(`coreSkill${itemNumber}Value`, skill.value);
        });
        renderFeaturedWork(defaultFeaturedWork);
        renderExperience(fallback.experience);
      }
    }

    document.getElementById('addExperienceBtn').addEventListener('click', () => {
      document.getElementById('experienceList').appendChild(createExperienceBlock());
    });

    document.getElementById('addFeaturedWorkBtn').addEventListener('click', () => {
      document.getElementById('featuredWorkList').appendChild(createFeaturedWorkBlock());
    });

    function collectExperience() {
      return [...document.querySelectorAll('#experienceList .experience-block')].map((block) => ({
        period: block.querySelector('[data-field="period"]').value.trim(),
        title: block.querySelector('[data-field="title"]').value.trim(),
        text: block.querySelector('[data-field="text"]').value.trim()
      })).filter((item) => item.period || item.title || item.text);
    }

    function collectFeaturedWork() {
      return [...document.querySelectorAll('#featuredWorkList .featured-work-block')].map(block => ({
        category: block.querySelector('[data-field="category"]').value.trim(),
        highlight: block.querySelector('[data-field="highlight"]').value.trim(),
        title: block.querySelector('[data-field="title"]').value.trim(),
        description: block.querySelector('[data-field="description"]').value.trim(),
        metricLabel: block.querySelector('[data-field="metricLabel"]').value.trim(),
        metricValue: block.querySelector('[data-field="metricValue"]').value.trim()
      })).filter(item => Object.values(item).some(Boolean));
    }

    function collectStats() {
      return [
        { value: document.getElementById('stat1Value').value, label: document.getElementById('stat1Label').value },
        { value: document.getElementById('stat2Value').value, label: document.getElementById('stat2Label').value },
        { value: document.getElementById('stat3Value').value, label: document.getElementById('stat3Label').value }
      ].filter(item => item.value || item.label);
    }

    function collectKeyMetrics() {
      return defaultKeyMetrics.map((_, index) => {
        const itemNumber = index + 1;
        return {
          label: document.getElementById(`keyMetric${itemNumber}Label`).value.trim(),
          value: document.getElementById(`keyMetric${itemNumber}Value`).value.trim(),
          detail: document.getElementById(`keyMetric${itemNumber}Detail`).value.trim()
        };
      });
    }

    function collectCoreSkills() {
      return defaultCoreSkills.map((_, index) => {
        const itemNumber = index + 1;
        return {
          label: document.getElementById(`coreSkill${itemNumber}Label`).value.trim(),
          value: Number(document.getElementById(`coreSkill${itemNumber}Value`).value || 0)
        };
      }).filter(skill => skill.label);
    }

    function collectFocusAreas() {
      return [
        { label: document.getElementById('focusArea1Label').value, value: Number(document.getElementById('focusArea1Value').value || 0) },
        { label: document.getElementById('focusArea2Label').value, value: Number(document.getElementById('focusArea2Value').value || 0) },
        { label: document.getElementById('focusArea3Label').value, value: Number(document.getElementById('focusArea3Value').value || 0) }
      ].filter(item => item.label || item.value || item.value === 0);
    }

    document.getElementById('adminForm').addEventListener('submit', async function (event) {
      event.preventDefault();
      const updated = {
        site: { brand: document.getElementById('brand').value, github: document.getElementById('github').value, githubUrl: document.getElementById('githubUrl').value },
        hero: { eyebrow: document.getElementById('heroEyebrow').value, title: document.getElementById('heroTitle').value, description: document.getElementById('heroDescription').value },
        profile: { name: document.getElementById('profileName').value, image: document.getElementById('profileImage').value, githubText: document.getElementById('profileGithubText').value, githubUrl: document.getElementById('profileGithubUrl').value },
        stats: collectStats(),
        keyMetrics: collectKeyMetrics(),
        coreSkills: collectCoreSkills(),
        featuredWork: collectFeaturedWork(),
        summary: { title: document.getElementById('summaryTitle').value, text: document.getElementById('summaryText').value },
        skills: document.getElementById('skills').value.split(',').map(s => s.trim()).filter(Boolean),
        contact: { email: document.getElementById('contactEmail').value, location: document.getElementById('contactLocation').value, linkedin: document.getElementById('contactLinkedin').value, phone: document.getElementById('contactPhone').value },
        focusAreas: collectFocusAreas(),
        experience: collectExperience()
      };

      const response = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: ADMIN_PASSWORD, data: updated })
      });

      const result = await response.json();
      const status = document.getElementById('status');
      const publicPortfolioUrl = `https://amans-2201.github.io/Static-Portfolio/?v=${Date.now()}`;
      if (response.ok) {
        status.textContent = 'Saved successfully.';
        setTimeout(() => window.location.href = publicPortfolioUrl, 700);
      } else {
        status.textContent = result.message || 'Save failed.';
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      sessionStorage.removeItem(authKey);
      window.location.href = getPublicPortfolioUrl();
    });

    const shell = document.querySelector('.shell');
    if (!authorizeAdmin()) {
      shell.style.filter = 'none';
      shell.style.pointerEvents = 'auto';
      shell.style.userSelect = 'auto';
    } else {
      shell.style.filter = 'none';
      shell.style.pointerEvents = 'auto';
      shell.style.userSelect = 'auto';
      loadData();
    }
  </script>
</body>
</html>
