<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Admin</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #4f46e5;
      --border: rgba(148, 163, 184, 0.28);
      --success: #16a34a;
      --shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "Segoe UI", sans-serif; background: linear-gradient(135deg, rgba(79,70,229,0.08), rgba(16,185,129,0.08)), var(--bg); color: var(--text);
    }
    .shell { max-width: 1100px; margin: 40px auto; padding: 0 20px 40px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: clamp(2rem, 2vw + 1.1rem, 3rem); }
    .btn { border: none; border-radius: 12px; padding: 0.9rem 1.3rem; font-weight: 700; cursor: pointer; font: inherit; }
    .btn.primary { background: linear-gradient(135deg, var(--primary), #6366f1); color: white; }
    .btn.secondary { background: rgba(99, 102, 241, 0.08); border: 1px solid var(--border); color: var(--text); }
    .panel { background: rgba(255,255,255,0.82); border: 1px solid var(--border); border-radius: 24px; box-shadow: var(--shadow); padding: 24px; }
    form { display: grid; gap: 28px; }
    .section-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px; }
    .field { display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 0.8rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
    input, textarea { width: 100%; border: 1px solid rgba(148, 163, 184, 0.5); border-radius: 12px; padding: 0.9rem 1rem; font: inherit; color: var(--text); background: white; }
    textarea { min-height: 110px; resize: vertical; }
    .experience-block { border: 1px solid var(--border); background: rgba(238,242,255,0.7); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
    .remove-btn { justify-self: end; background: rgba(239,68,68,0.1); color: #b91c1c; border: 1px solid rgba(239,68,68,0.2); border-radius: 10px; padding: 0.5rem 0.75rem; font-weight: 700; cursor: pointer; }
    .actions { display: flex; justify-content: flex-end; gap: 12px; }
    .status { min-height: 24px; font-weight: 700; color: var(--success); }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <h1>Portfolio Admin</h1>
      <button type="button" class="btn secondary" id="logoutBtn">Logout</button>
    </header>

    <main class="panel">
      <form id="adminForm">
        <section>
          <h2>Site info</h2>
          <div class="section-grid">
            <div class="field"><label for="brand">Brand name</label><input id="brand" type="text" /></div>
            <div class="field"><label for="github">GitHub text</label><input id="github" type="text" /></div>
            <div class="field"><label for="githubUrl">GitHub URL</label><input id="githubUrl" type="url" /></div>
          </div>
        </section>

        <section>
          <h2>Hero section</h2>
          <div class="section-grid">
            <div class="field"><label for="heroEyebrow">Eyebrow</label><input id="heroEyebrow" type="text" /></div>
            <div class="field" style="grid-column: 1 / -1;"><label for="heroTitle">Title</label><input id="heroTitle" type="text" /></div>
            <div class="field" style="grid-column: 1 / -1;"><label for="heroDescription">Description</label><textarea id="heroDescription"></textarea></div>
          </div>
        </section>

        <section>
          <h2>Profile</h2>
          <div class="section-grid">
            <div class="field"><label for="profileName">Profile name</label><input id="profileName" type="text" /></div>
            <div class="field"><label for="profileImage">Profile image path</label><input id="profileImage" type="text" /></div>
            <div class="field"><label for="profileGithubText">Profile GitHub text</label><input id="profileGithubText" type="text" /></div>
            <div class="field"><label for="profileGithubUrl">Profile GitHub URL</label><input id="profileGithubUrl" type="url" /></div>
          </div>
        </section>

        <section>
          <h2>Summary & contact</h2>
          <div class="section-grid">
            <div class="field"><label for="summaryTitle">Summary title</label><input id="summaryTitle" type="text" /></div>
            <div class="field" style="grid-column: 1 / -1;"><label for="summaryText">Summary text</label><textarea id="summaryText"></textarea></div>
            <div class="field"><label for="contactEmail">Email</label><input id="contactEmail" type="email" /></div>
            <div class="field"><label for="contactLocation">Location</label><input id="contactLocation" type="text" /></div>
            <div class="field"><label for="contactLinkedin">LinkedIn</label><input id="contactLinkedin" type="text" /></div>
            <div class="field"><label for="contactPhone">Phone</label><input id="contactPhone" type="text" /></div>
          </div>
        </section>

        <section>
          <h2>Stats</h2>
          <div class="section-grid">
            <div class="field"><label for="stat1Value">Stat 1 value</label><input id="stat1Value" type="text" /></div>
            <div class="field"><label for="stat1Label">Stat 1 label</label><input id="stat1Label" type="text" /></div>
            <div class="field"><label for="stat2Value">Stat 2 value</label><input id="stat2Value" type="text" /></div>
            <div class="field"><label for="stat2Label">Stat 2 label</label><input id="stat2Label" type="text" /></div>
            <div class="field"><label for="stat3Value">Stat 3 value</label><input id="stat3Value" type="text" /></div>
            <div class="field"><label for="stat3Label">Stat 3 label</label><input id="stat3Label" type="text" /></div>
          </div>
        </section>

        <section>
          <h2>Skills</h2>
          <div class="field"><label for="skills">Skills (comma separated)</label><textarea id="skills"></textarea></div>
        </section>

        <section>
          <h2>Experience</h2>
          <div id="experienceList"></div>
          <div class="actions" style="justify-content: flex-start; margin-top: 12px;"><button type="button" class="btn secondary" id="addExperienceBtn">+ Add Experience</button></div>
        </section>

        <div class="actions">
          <button type="button" class="btn secondary" onclick="window.location.href='/'">Back to site</button>
          <button type="submit" class="btn primary">Save and update</button>
        </div>
        <div id="status" class="status" aria-live="polite"></div>
      </form>
    </main>
  </div>

  <script>
    const ADMIN_PASSWORD = window.ADMIN_PASSWORD || '';
    const apiUrl = '/api/portfolio';
    const authKey = 'portfolio-admin-authorized';

    function getAuthOverlay() {
      const existing = document.getElementById('adminAuthOverlay');
      if (existing) return existing;

      const overlay = document.createElement('div');
      overlay.id = 'adminAuthOverlay';
      overlay.style.position = 'fixed';
      overlay.style.inset = '0';
      overlay.style.background = 'rgba(15, 23, 42, 0.72)';
      overlay.style.display = 'flex';
      overlay.style.alignItems = 'center';
      overlay.style.justifyContent = 'center';
      overlay.style.zIndex = '9999';

      const box = document.createElement('div');
      box.style.width = 'min(420px, calc(100% - 28px))';
      box.style.background = '#fff';
      box.style.borderRadius = '20px';
      box.style.padding = '24px';
      box.style.boxShadow = '0 20px 45px rgba(15, 23, 42, 0.22)';
      box.innerHTML = `
        <h2 style="margin:0 0 8px;font-size:1.7rem;">Admin access</h2>
        <p style="margin:0 0 18px;color:#475569;">Enter the password to continue.</p>
        <input id="adminAuthInput" type="password" placeholder="Password" style="width:100%;border:1px solid rgba(148,163,184,0.6);border-radius:12px;padding:0.9rem 1rem;font:inherit;margin-bottom:14px;" />
        <div style="display:flex;justify-content:flex-end;gap:10px;">
          <button type="button" id="adminAuthCancel" style="border:none;border-radius:12px;padding:0.75rem 1rem;background:#eef2ff;color:#1f2937;font-weight:700;cursor:pointer;">Cancel</button>
          <button type="button" id="adminAuthSubmit" style="border:none;border-radius:12px;padding:0.75rem 1rem;background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;font-weight:700;cursor:pointer;">Open</button>
        </div>
      `;

      overlay.appendChild(box);
      document.body.appendChild(overlay);
      return overlay;
    }

    function authorizeAdmin() {
      if (!ADMIN_PASSWORD) {
        alert('Admin password is not configured.');
        window.location.href = '/';
        return false;
      }

      const stored = sessionStorage.getItem(authKey) === 'true';
      if (stored) return true;

      const overlay = getAuthOverlay();
      const input = document.getElementById('adminAuthInput');
      const submit = document.getElementById('adminAuthSubmit');
      const cancel = document.getElementById('adminAuthCancel');

      const unlock = () => {
        const password = input.value.trim();
        if (password === ADMIN_PASSWORD) {
          sessionStorage.setItem(authKey, 'true');
          overlay.remove();
          loadData();
          return;
        }

        input.value = '';
        input.focus();
        alert('Incorrect password.');
      };

      submit.addEventListener('click', unlock);
      cancel.addEventListener('click', () => {
        sessionStorage.removeItem(authKey);
        window.location.href = '/';
      });
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') unlock();
      });

      input.focus();
      return false;
    }

    function createExperienceBlock(entry = {}) {
      const block = document.createElement('div');
      block.className = 'experience-block';
      block.innerHTML = `
        <button type="button" class="remove-btn">Remove</button>
        <div class="field"><label>Period</label><input type="text" data-field="period" value="${(entry.period || '').replace(/"/g, '&quot;')}" /></div>
        <div class="field"><label>Title</label><input type="text" data-field="title" value="${(entry.title || '').replace(/"/g, '&quot;')}" /></div>
        <div class="field"><label>Text</label><textarea data-field="text">${(entry.text || '').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</textarea></div>
      `;
      block.querySelector('.remove-btn').addEventListener('click', () => block.remove());
      return block;
    }

    function renderExperience(entries) {
      const list = document.getElementById('experienceList');
      list.innerHTML = '';
      const items = entries && entries.length ? entries : [{ period: '2024 — Present', title: 'Lead Analytics Architect — FinTech Corp', text: 'Leading the design of cloud-based forecasting, self-serve dashboards, and executive insight systems across the organization.' }];
      items.forEach(item => list.appendChild(createExperienceBlock(item)));
    }

    function setValue(id, value) {
      const input = document.getElementById(id);
      if (input) input.value = value ?? '';
    }

    async function loadData() {
      const sources = [
        'https://amans-2201.github.io/Static-Portfolio/portfolio-data.js',
        apiUrl
      ];

      let data = {};

      for (const url of sources) {
        try {
          const response = await fetch(url, { cache: 'no-store' });
          if (!response.ok) continue;

          const text = await response.text();

          if (url.includes('portfolio-data.js')) {
            const match = text.match(/window\.portfolioData\s*=\s*(\{[\s\S]*?\});\s*window\.portfolioStorageKey/);
            if (match && match[1]) {
              data = JSON.parse(match[1]);
              break;
            }
          } else {
            data = await response.json();
            break;
          }
        } catch (error) {
          console.warn('Portfolio source unavailable:', url, error);
        }
      }

      setValue('brand', data.site?.brand || 'Alex Morgan');
      setValue('github', data.site?.github || 'github.com/alexmorgan');
      setValue('githubUrl', data.site?.githubUrl || 'https://github.com/alexmorgan');
      setValue('heroEyebrow', data.hero?.eyebrow || 'Data Analyst • Storyteller');
      setValue('heroTitle', data.hero?.title || 'I turn raw data into business momentum.');
      setValue('heroDescription', data.hero?.description || '');
      setValue('profileName', data.profile?.name || 'Alex Morgan');
      setValue('profileImage', data.profile?.image || './dummy-profile.jpg');
      setValue('profileGithubText', data.profile?.githubText || 'github.com/alexmorgan');
      setValue('profileGithubUrl', data.profile?.githubUrl || 'https://github.com/alexmorgan');
      setValue('summaryTitle', data.summary?.title || 'Professional Summary');
      setValue('summaryText', data.summary?.text || '');
      setValue('contactEmail', data.contact?.email || 'alex.morgan@email.com');
      setValue('contactLocation', data.contact?.location || 'New York, NY');
      setValue('contactLinkedin', data.contact?.linkedin || 'linkedin.com/in/alexmorgan');
      setValue('contactPhone', data.contact?.phone || '+1 (415) 224-9901');
      setValue('stat1Value', data.stats?.[0]?.value || '5+');
      setValue('stat1Label', data.stats?.[0]?.label || 'Years experience');
      setValue('stat2Value', data.stats?.[1]?.value || '40+');
      setValue('stat2Label', data.stats?.[1]?.label || 'Dashboards shipped');
      setValue('stat3Value', data.stats?.[2]?.value || '$2.4M');
      setValue('stat3Label', data.stats?.[2]?.label || 'Revenue impact');
      setValue('skills', (data.skills || []).join(', '));
      renderExperience(data.experience || []);
    }

    document.getElementById('addExperienceBtn').addEventListener('click', () => {
      document.getElementById('experienceList').appendChild(createExperienceBlock());
    });

    function collectExperience() {
      return [...document.querySelectorAll('.experience-block')].map((block) => ({
        period: block.querySelector('[data-field="period"]').value.trim(),
        title: block.querySelector('[data-field="title"]').value.trim(),
        text: block.querySelector('[data-field="text"]').value.trim()
      })).filter((item) => item.period || item.title || item.text);
    }

    function collectStats() {
      return [
        { value: document.getElementById('stat1Value').value, label: document.getElementById('stat1Label').value },
        { value: document.getElementById('stat2Value').value, label: document.getElementById('stat2Label').value },
        { value: document.getElementById('stat3Value').value, label: document.getElementById('stat3Label').value }
      ].filter(item => item.value || item.label);
    }

    document.getElementById('adminForm').addEventListener('submit', async function (event) {
      event.preventDefault();
      const updated = {
        site: { brand: document.getElementById('brand').value, github: document.getElementById('github').value, githubUrl: document.getElementById('githubUrl').value },
        hero: { eyebrow: document.getElementById('heroEyebrow').value, title: document.getElementById('heroTitle').value, description: document.getElementById('heroDescription').value },
        profile: { name: document.getElementById('profileName').value, image: document.getElementById('profileImage').value, githubText: document.getElementById('profileGithubText').value, githubUrl: document.getElementById('profileGithubUrl').value },
        stats: collectStats(),
        summary: { title: document.getElementById('summaryTitle').value, text: document.getElementById('summaryText').value },
        skills: document.getElementById('skills').value.split(',').map(s => s.trim()).filter(Boolean),
        contact: { email: document.getElementById('contactEmail').value, location: document.getElementById('contactLocation').value, linkedin: document.getElementById('contactLinkedin').value, phone: document.getElementById('contactPhone').value },
        experience: collectExperience()
      };

      const response = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: ADMIN_PASSWORD, data: updated })
      });

      const result = await response.json();
      const status = document.getElementById('status');
      if (response.ok) {
        status.textContent = 'Saved successfully.';
        setTimeout(() => window.location.href = '/', 700);
      } else {
        status.textContent = result.message || 'Save failed.';
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      sessionStorage.removeItem(authKey);
      window.location.href = '/';
    });

    const shell = document.querySelector('.shell');
    if (!authorizeAdmin()) {
      shell.style.filter = 'blur(2px)';
      shell.style.pointerEvents = 'none';
      shell.style.userSelect = 'none';
    } else {
      shell.style.filter = 'none';
      shell.style.pointerEvents = 'auto';
      shell.style.userSelect = 'auto';
    }
  </script>
</body>
</html>
